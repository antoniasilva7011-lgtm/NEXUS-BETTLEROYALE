name: Build Godot Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "GodotPrototype/**"
      - ".github/workflows/build-godot-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.4.1"
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable"
          curl -fL "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip" -o "$HOME/godot/godot.zip"
          unzip -q "$HOME/godot/godot.zip" -d "$HOME/godot"
          curl -fL "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION-stable/Godot_v$GODOT_VERSION-stable_export_templates.tpz" -o "$HOME/godot/templates.tpz"
          unzip -q "$HOME/godot/templates.tpz" -d "$HOME/godot/templates"
          cp -a "$HOME/godot/templates/templates/." "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable/"
          GODOT_BIN="$(find "$HOME/godot" -maxdepth 1 -type f -name 'Godot_v*linux.x86_64' | head -n1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Validate project and export APK
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --editor --path GodotPrototype --quit
          "$GODOT_BIN" --headless --path GodotPrototype --import
          "$GODOT_BIN" --headless --path GodotPrototype --export-debug "Android" GodotPrototype/build/NEXUS-BattleRoyale.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-BattleRoyale-Android-APK
          path: GodotPrototype/build/NEXUS-BattleRoyale.apk
          if-no-files-found: error
          retention-days: 14
